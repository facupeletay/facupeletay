name: Actualizar Perfil y Mapa de Contribuciones

on:
  schedule:
    # Se ejecuta automáticamente todos los días a las 09:00 y 21:00 (hora Argentina aprox.)
    - cron: "0 12,0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Actualizar sección dinámica del README
        run: python scripts/update_activity.py

      - name: Hacer commit de la actualización en main
        run: |
          git config user.name "Facundo Peletay"
          git config user.email "facundopeletay46@gmail.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore(profile): actualizar estado dinámico del README"
          git push

      - name: Generar animación Snake de contribuciones (Modo Claro y Oscuro)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publicar animación Snake en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
